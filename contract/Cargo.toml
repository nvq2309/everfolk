[package]
name = "everfolk-lives"
version = "0.1.0"
edition = "2021"
description = "Everfolk ranked lives, figure NFTs and source royalties on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"
bs58 = "0.5"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
