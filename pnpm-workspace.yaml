packages:
  - .
allowBuilds:
  esbuild: true
  secp256k1: false
  sharp: true
  workerd: true
# @meteorwallet/sdk peers on near-api-js ^6 and imports its `utils` export, which v7 removed.
# Resolve that peer to v6 under the Meteor adapter only; app code keeps near-api-js 7.
packageExtensions:
  "@near-wallet-selector/meteor-wallet@10.1.4":
    dependencies:
      near-api-js: 6.2.5
