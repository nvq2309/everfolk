name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); if (Number(process.versions.node.split(".")[0]) < 24 || pkg.packageManager !== "pnpm@11.25.0") throw new Error("Expected Node.js 24+ and pnpm@11.25.0.");'
          test "$(pnpm --version)" = "11.25.0"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Run regression suite
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Check generated source stays reproducible
        run: git diff --exit-code

  contract:
    name: Test the NEAR contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Run contract unit tests
        run: cargo test --locked --lib
